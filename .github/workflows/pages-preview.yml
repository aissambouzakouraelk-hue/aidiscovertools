name: Publish AI Discover Tools preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML and catalog
        run: |
          node scripts/check-site.js
          for file in *.js scripts/*.js; do node --check "$file"; done
      - name: Build noindex preview
        run: |
          node scripts/build-pages-preview.js
          node scripts/build-reviewed-pages.js
      - name: Prepare and check production bundle (never deployed)
        run: |
          node scripts/build-production.js
          node scripts/check-production.js
          node scripts/check-netlify-config.js
      - name: Validate Cloudflare Pages migration package (not deployed)
        run: node scripts/build-cloudflare.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
