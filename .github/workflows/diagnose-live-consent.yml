name: Diagnose live analytics consent without changing production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-consent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Diagnose public consent state
        run: node scripts/diagnose-live-consent.js
